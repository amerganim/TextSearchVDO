<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1218">
  <title>Pair with TextSearchVDO</title>
  <link rel="stylesheet" href="/static/pair.css">
</head>
<body>
  <main class="pair">
    <div class="mark" aria-hidden="true"></div>
    <h1>TextSearchVDO</h1>
    <p class="lede">
      Enter the six-digit code shown on the computer to let this phone in.
    </p>

    <form id="form" novalidate>
      <label class="field">
        <span>Code</span>
        <!-- inputmode numeric rather than type=number: a phone gets the
             digit keypad without the spinner, and without dropping a
             leading zero. -->
        <input id="code" inputmode="numeric" autocomplete="one-time-code"
               pattern="[0-9]*" maxlength="7" placeholder="000000"
               enterkeyhint="go" autofocus>
      </label>

      <label class="field">
        <span>Call this phone</span>
        <input id="name" type="text" maxlength="64" placeholder="My phone"
               autocomplete="off" enterkeyhint="go">
      </label>

      <button type="submit" id="go">Pair</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>

    <p class="fine">
      Pairing lasts 30 days. The computer can revoke this phone at any time.
      Everything stays on your own network &mdash; nothing is uploaded anywhere.
    </p>
  </main>

  <script>
    const form = document.getElementById("form");
    const code = document.getElementById("code");
    const name = document.getElementById("name");
    const status = document.getElementById("status");
    const go = document.getElementById("go");

    // Typing the code is the whole job, so accept it in whatever shape it
    // arrives - pasted with a space, or with the dash people add themselves.
    code.addEventListener("input", () => {
      code.value = code.value.replace(/[^0-9]/g, "").slice(0, 6);
      go.disabled = code.value.length !== 6;
    });
    go.disabled = true;

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      go.disabled = true;
      status.textContent = "Checking…";
      status.className = "status";

      try {
        const response = await fetch("/api/pair", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code: code.value, name: name.value }),
        });
        if (response.ok) {
          status.textContent = "Paired. Opening…";
          status.className = "status good";
          location.href = "/";
          return;
        }
        const body = await response.json().catch(() => ({}));
        status.textContent = body.detail || "That code is not right.";
        status.className = "status bad";
        code.value = "";
        code.focus();
      } catch (err) {
        status.textContent = "Could not reach the computer. Is it still sharing?";
        status.className = "status bad";
      }
      go.disabled = code.value.length !== 6;
    });
  </script>
</body>
</html>
