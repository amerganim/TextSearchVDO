<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TextSearchVDO</title>
  <link rel="stylesheet" href="/static/simple.css">
</head>
<body>
  <header>
    <div class="brand">TextSearchVDO</div>
    <div class="library" id="library"></div>
    <button type="button" id="add">Add video</button>
    <a class="ghost link" href="/advanced" title="Timeline, zones and people">Advanced</a>
  </header>

  <!-- Always present once anything is indexed. Never hidden by processing. -->
  <section class="searchbar" id="searchbar">
    <input id="q" type="search" autocomplete="off" spellcheck="false"
           placeholder="What are you looking for?">
    <button type="button" id="go">Search</button>
  </section>
  <div class="examples" id="examples"></div>

  <!-- Processing runs here, as a strip. It does not take over the app. -->
  <section class="progress-strip" id="strip" hidden>
    <div class="strip-row">
      <span class="spinner" aria-hidden="true"></span>
      <span class="strip-title" id="strip-title">Working</span>
      <span class="strip-detail" id="strip-detail"></span>
      <span class="strip-pct" id="strip-pct"></span>
    </div>
    <div class="bar"><div class="fill" id="strip-fill"></div></div>
    <div class="strip-note">
      You can search whatever has already been read while this finishes.
    </div>
  </section>

  <div id="notices"></div>

  <!-- Shown only when the library is empty. -->
  <section class="stage" id="stage-empty">
    <div class="dropzone" id="dropzone">
      <div class="drop-icon" aria-hidden="true">&#9634;</div>
      <h1>Add a video to get started</h1>
      <p><button type="button" id="choose">Choose a video</button></p>
      <p class="or" id="or-drop">or drag one onto this window</p>
      <p class="fine">
        Long recordings are fine. Most of a security recording is nothing
        happening, and that part gets skipped rather than watched.
      </p>
    </div>
  </section>

  <!-- Results. -->
  <section class="stage" id="stage-results" hidden>
    <div class="answer" id="answer" hidden>
      <div class="answer-headline" id="answer-headline"></div>
      <div class="answer-caveat" id="answer-caveat" hidden></div>
    </div>
    <div class="status" id="status"></div>
    <div class="results" id="results"></div>
    <div class="nothing" id="nothing" hidden>
      <h2>Nothing found</h2>
      <p id="nothing-why"></p>
    </div>
  </section>

  <div class="player-backdrop" id="player-backdrop" hidden>
    <div class="player-box">
      <div class="player-head">
        <span id="player-caption"></span>
        <button type="button" class="ghost" id="player-close">Close</button>
      </div>
      <video id="video" controls preload="metadata"></video>
    </div>
  </div>

  <input type="file" id="filepick" accept="video/*,.mp4,.mkv,.avi,.mov,.m4v,.ts,.dav,.flv" multiple hidden>
  <script src="/static/simple.js"></script>
</body>
</html>
